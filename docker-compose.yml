version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: svg-processor-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - svg-processor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: svg-processor-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/svg-processor
      - NODE_ENV=production
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - svg-processor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: svg-processor-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - svg-processor-network

volumes:
  mongodb_data:

networks:
  svg-processor-network:
    driver: bridge
